server {
    listen 80;
    server_name app.safesips.org;
    root /usr/share/nginx/html;
    index index.html;

    # Static health for container probes (no upstream leak)
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Service worker: always revalidate, or clients can be stuck on an old
    # worker. (add_header here replaces the server-level ones, so repeat them.)
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA fallback — /join/:code and client routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
