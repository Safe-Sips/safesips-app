<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e1330" />
    <meta
      name="description"
      content="SafeSips live safety map. Share an approximate area while keeping your exact location private."
    />
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- No apple-mobile-web-app-status-bar-style: with "black-translucent",
         iOS 26 Home Screen apps are laid out one status bar short (WebKit bug
         301108: an empty band at the bottom) and get a gradient drawn over the
         status bar. The default bar is solid and takes theme-color (navy). -->
    <meta name="apple-mobile-web-app-title" content="SafeSips">

    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>SafeSips · Live Safety Map</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
