name: Deploy check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The repository root IS the safesips-app monorepo, so every step runs from the
# checkout root (no working-directory).
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Start server and smoke test
        env:
          # Lets the smoke test mint a throwaway token for the authenticated
          # socket round-trip. config.ts ignores it when NODE_ENV=production.
          ALLOW_TEST_TOKEN: "1"
        run: |
          npm run start:server &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/health > /dev/null && break
            sleep 1
          done
          node scripts/smoke-test.mjs
          node scripts/uptime-check.mjs
