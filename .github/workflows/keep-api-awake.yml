name: Keep API awake

# Render's free plan puts the API to sleep after 15 minutes without traffic.
# A sleeping API makes the app slow to open (30-60 s to wake) and, worse,
# stops the check-in scheduler: missed check-ins wouldn't alert anyone until
# something woke it. Ping it often enough that it never sleeps. (One service
# running all month fits in the free plan's 750 instance hours.)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://safesips-app.onrender.com/health; then
              exit 0
            fi
            sleep 10
          done
          echo "API did not answer /health" >&2
          exit 1
